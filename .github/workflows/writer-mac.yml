name: Writing Battle Pass (Mac)

# Builds, tests and packages the Mac app in writer/ on GitHub's Apple
# silicon runners. Nobody working on it needs a Mac: this is the compiler.

on:
  push:
    # Branches must be named too: a trigger that lists only tags ignores
    # every branch push.
    branches: ["**"]
    paths: ["writer/**", ".github/workflows/writer-mac.yml"]
    tags: ["writer-v*"]
  pull_request:
    paths: ["writer/**", ".github/workflows/writer-mac.yml"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a build still running for the same branch.
concurrency:
  group: writer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: writer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: swift --version && sw_vers && uname -m
      - name: Build the app
        run: tools/make_app.sh "${GITHUB_REF_NAME#writer-v}"
        if: startsWith(github.ref, 'refs/tags/writer-v')
      - name: Build the app
        run: tools/make_app.sh 1.0
        if: "!startsWith(github.ref, 'refs/tags/writer-v')"
      - name: Snapshots of every page
        run: tools/snapshots.sh
        continue-on-error: true
      - name: Tests (look for "Demo" and "Economy" in this log)
        if: always()
        run: swift test 2>&1 | grep -v "passed (" 
        shell: bash -o pipefail {0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Writing-Battle-Pass
          path: writer/build/Writing-Battle-Pass.dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: writer/build/snapshots
      - name: Snapshots in the log (for reading without the artifact)
        if: always()
        run: tools/print_snapshots.sh
        continue-on-error: true
      - name: Release
        if: startsWith(github.ref, 'refs/tags/writer-v')
        uses: softprops/action-gh-release@v2
        with:
          files: writer/build/Writing-Battle-Pass.dmg
          name: Writing Battle Pass ${{ github.ref_name }}
          body: |
            Download Writing-Battle-Pass.dmg below, open it and drag the app into Applications.
            "Read me first" inside says what to do the first time.
